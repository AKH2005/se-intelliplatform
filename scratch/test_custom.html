<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Application Dashboard — Live Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #0b0f19 75%);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem 2rem;
    }
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
    .header h1 { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, #fff 30%, #a5b4fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0.25rem; }
    .status-badge { background: rgba(16, 185, 129, 0.15); color: #34d399; font-size: 0.8rem; font-weight: 700; padding: 0.35rem 0.85rem; border-radius: 9999px; border: 1px solid rgba(16, 185, 129, 0.3); }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-bottom: 1.75rem; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
    .kpi-label { font-size: 0.8rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .kpi-value { font-size: 1.75rem; font-weight: 800; margin-top: 0.4rem; font-family: 'JetBrains Mono', monospace; }
    .main-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; gap: 1rem; }
    .search-input { background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border); border-radius: 8px; color: white; padding: 0.55rem 1rem; width: 320px; font-size: 0.9rem; }
    .btn { padding: 0.55rem 1.25rem; border-radius: 8px; font-weight: 700; cursor: pointer; border: none; font-size: 0.85rem; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: rgba(255,255,255,0.08); color: white; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); color: var(--muted); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
    td { padding: 0.85rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .pill { padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
    .pill-active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .pill-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .pill-archived { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Interactive Application Dashboard</h1>
      <p class="subtitle">Full-stack application synthesized according to confirmed project specifications.</p>
    </div>
    <div style="display: flex; gap: 0.75rem; align-items: center;">
      <span class="status-badge">APPLICATION ACTIVE</span>
      <button class="btn btn-secondary" onclick="exportData()">Export Dataset</button>
      <button class="btn btn-primary" onclick="openNewModal()">+ New Entry</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-label">Total Records</div><div class="kpi-value" id="kpi-total" style="color: #818cf8;">24</div></div>
    <div class="kpi-card"><div class="kpi-label">Active / Live</div><div class="kpi-value" id="kpi-active" style="color: #34d399;">18</div></div>
    <div class="kpi-card"><div class="kpi-label">Pending Review</div><div class="kpi-value" id="kpi-pending" style="color: #fbbf24;">4</div></div>
    <div class="kpi-card"><div class="kpi-label">Health Index</div><div class="kpi-value" style="color: #38bdf8;">99.4%</div></div>
  </div>

  <div class="main-card">
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by title, ID, or category..." oninput="filterTable()">
      <div style="color: var(--muted); font-size: 0.85rem;" id="tableCount">Showing 5 of 5 entries</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Identifier</th>
          <th>Entity Name</th>
          <th>Domain Category</th>
          <th>Status</th>
          <th>Priority</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    let items = [
      { id: "ENT-101", name: "Primary Data Controller", category: "Core Infrastructure", status: "Active", priority: "High" },
      { id: "ENT-102", name: "Security Authentication Filter", category: "Compliance", status: "Active", priority: "Critical" },
      { id: "ENT-103", name: "External Webhook Gateway", category: "Integration", status: "Pending", priority: "Medium" },
      { id: "ENT-104", name: "Batch Synchronization Task", category: "Data Pipeline", status: "Active", priority: "High" },
      { id: "ENT-105", name: "Reporting Aggregator Node", category: "Analytics", status: "Pending", priority: "Low" }
    ];

    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = items.filter(it => it.name.toLowerCase().includes(q) || it.id.toLowerCase().includes(q) || it.category.toLowerCase().includes(q));
      tbody.innerHTML = '';
      filtered.forEach((it, idx) => {
        const pillClass = it.status === 'Active' ? 'pill-active' : (it.status === 'Pending' ? 'pill-pending' : 'pill-archived');
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #818cf8;">${it.id}</td>
          <td style="font-weight: 600;">${it.name}</td>
          <td style="color: var(--muted);">${it.category}</td>
          <td><span class="pill ${pillClass}">${it.status}</span></td>
          <td style="font-weight: 600;">${it.priority}</td>
          <td>
            <button class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.75rem;" onclick="toggleStatus(${idx})">Toggle</button>
            <button class="btn btn-secondary" style="padding: 0.25rem 0.6rem; font-size: 0.75rem; color: #ef4444;" onclick="deleteItem(${idx})">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      document.getElementById('tableCount').innerText = `Showing ${filtered.length} of ${items.length} entries`;
      document.getElementById('kpi-total').innerText = items.length;
      document.getElementById('kpi-active').innerText = items.filter(i => i.status === 'Active').length;
      document.getElementById('kpi-pending').innerText = items.filter(i => i.status === 'Pending').length;
    }

    function filterTable() { renderTable(); }
    function toggleStatus(idx) {
      items[idx].status = items[idx].status === 'Active' ? 'Pending' : 'Active';
      renderTable();
    }
    function deleteItem(idx) {
      items.splice(idx, 1);
      renderTable();
    }
    function openNewModal() {
      const name = prompt("Enter new item title:");
      if (name) {
        const id = "ENT-" + (100 + items.length + 1);
        items.unshift({ id, name, category: "User Created", status: "Active", priority: "Normal" });
        renderTable();
      }
    }
    function exportData() {
      const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'interactive_application_dashboard_dataset.json';
      a.click();
    }

    renderTable();
  </script>
</body>
</html>
