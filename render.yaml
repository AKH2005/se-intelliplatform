# Render Blueprint for SE IntelliPlatform
# Deploys FastAPI Backend on Render Free Tier with Neon PostgreSQL
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: se-intelliplatform-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.vercel\.app$
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

