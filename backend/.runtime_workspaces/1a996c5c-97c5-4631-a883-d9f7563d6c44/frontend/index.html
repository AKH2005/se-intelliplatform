<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Task Manager</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 2rem; }
      .app-container { max-width: 680px; margin: 0 auto; background: #1e293b; border-radius: 8px; padding: 1.5rem; border: 1px solid #334155; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
      .status-badge { padding: 0.3rem 0.8rem; border-radius: 9999px; font-size: 0.85rem; font-weight: 600; background: #059669; color: white; }
      .task-form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
      .task-form input { flex: 1; padding: 0.6rem; background: #0f172a; border: 1px solid #475569; border-radius: 4px; color: white; }
      .task-form button { padding: 0.6rem 1.2rem; background: #3b82f6; border: none; border-radius: 4px; color: white; font-weight: 600; cursor: pointer; }
      .task-card { background: #334155; padding: 1rem; border-radius: 6px; margin-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
      .task-title { font-weight: 500; font-size: 1rem; }
      .task-status { font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: #475569; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var React = {
          createElement: function(type, props) {
            props = props || {};
            var children = Array.prototype.slice.call(arguments, 2).flat(Infinity).filter(function(c) { return c != null && c !== false; });
            return { type: type, props: Object.assign({}, props, { children: children }) };
          },
          useState: function(initial) {
            var fiber = React._currentFiber;
            var idx = fiber.hookIndex++;
            if (!fiber.hooks[idx]) {
              fiber.hooks[idx] = [typeof initial === 'function' ? initial() : initial, function(val) {
                fiber.hooks[idx][0] = typeof val === 'function' ? val(fiber.hooks[idx][0]) : val;
                React._scheduleRender();
              }];
            }
            return fiber.hooks[idx];
          },
          useEffect: function(effect, deps) {
            var fiber = React._currentFiber;
            var idx = fiber.hookIndex++;
            var prev = fiber.hooks[idx];
            var changed = !prev || !deps || deps.some(function(d, i) { return d !== prev.deps[i]; });
            if (changed) {
              if (prev && prev.cleanup) prev.cleanup();
              fiber.hooks[idx] = { deps: deps, effect: effect, cleanup: null };
              fiber.pendingEffects.push(fiber.hooks[idx]);
            }
          },
          _currentFiber: null,
          _scheduleRender: null
        };

        var ReactDOM = {
          createRoot: function(container) {
            var fiber = { hooks: [], hookIndex: 0, pendingEffects: [], container: container, rootComponent: null };
            function renderDOM(vnode) {
              if (typeof vnode === 'string' || typeof vnode === 'number') {
                return document.createTextNode(String(vnode));
              }
              if (!vnode || !vnode.type) return document.createTextNode('');
              if (typeof vnode.type === 'function') {
                React._currentFiber = fiber;
                fiber.hookIndex = 0;
                var child = vnode.type(vnode.props);
                return renderDOM(child);
              }
              var el = document.createElement(vnode.type);
              var props = vnode.props || {};
              for (var key in props) {
                if (key === 'children') continue;
                var val = props[key];
                if (key === 'className') { el.className = val; }
                else if (key === 'style' && typeof val === 'object') { Object.assign(el.style, val); }
                else if (key.indexOf('on') === 0 && typeof val === 'function') {
                  var evt = key.substring(2).toLowerCase();
                  el.addEventListener(evt, val);
                  if (evt === 'change') { el.addEventListener('input', val); }
                } else if (key === 'value') {
                  el.value = val;
                  el.setAttribute('value', val);
                } else if (val !== null && val !== undefined) {
                  el.setAttribute(key, val);
                }
              }
              for (var i = 0; i < (props.children || []).length; i++) {
                el.appendChild(renderDOM(props.children[i]));
              }
              return el;
            }

            function performRender() {
              fiber.pendingEffects = [];
              var dom = renderDOM(React.createElement(fiber.rootComponent));
              container.innerHTML = '';
              container.appendChild(dom);
              var effects = fiber.pendingEffects.slice();
              for (var j = 0; j < effects.length; j++) {
                effects[j].cleanup = effects[j].effect();
              }
            }

            React._scheduleRender = performRender;
            return {
              render: function(rootComponent) {
                fiber.rootComponent = rootComponent;
                performRender;
                performRender();
              }
            };
          }
        };

        window.React = React;
        window.ReactDOM = ReactDOM;
      })();

      (function() {
        var e = React.createElement;
        var useState = React.useState;
        var useEffect = React.useEffect;

        function App() {
          var tasksState = useState([]);
          var tasks = tasksState[0];
          var setTasks = tasksState[1];
          var statusState = useState('Connecting to backend...');
          var status = statusState[0];
          var setStatus = statusState[1];
          var titleState = useState('');
          var title = titleState[0];
          var setTitle = titleState[1];
          var loadingState = useState(true);
          var loading = loadingState[0];
          var setLoading = loadingState[1];

          useEffect(function() {
            function loadTasks() {
              fetch('/tasks')
                .then(function(res) {
                  if (res.ok) return res.json();
                  return fetch('/api/tasks').then(function(r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                  });
                })
                .then(function(data) {
                  setTasks(data);
                  setStatus('Ready');
                  setLoading(false);
                })
                .catch(function(err) {
                  setStatus('Connection Error: ' + err.message);
                  setLoading(false);
                });
            }
            loadTasks();
          }, []);

          function handleCreateTask(ev) {
            if (ev && ev.preventDefault) ev.preventDefault();
            var inputEl = document.getElementById('new-task-input');
            var currentTitle = (title || (inputEl && inputEl.value) || '').trim();
            if (!currentTitle) return;
            var payload = { title: currentTitle, priority: 'MEDIUM', status: 'PENDING' };
            function postTo(url) {
              return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              }).then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
              });
            }
            postTo('/tasks')
              .catch(function() { return postTo('/api/tasks'); })
              .then(function(created) {
                setTasks(function(prev) { return prev.concat([created]); });
                setTitle('');
                if (inputEl) inputEl.value = '';
              })
              .catch(function(err) {
                alert('Error creating task: ' + err.message);
              });
          }

          return e('div', { className: 'app-container', 'data-testid': 'app-container' },
            e('div', { className: 'header' },
              e('h1', { id: 'app-title', 'data-testid': 'app-title' }, 'Simple Task Manager'),
              e('span', { id: 'api-status', 'data-testid': 'api-status', className: 'status-badge' }, status)
            ),
            e('form', { id: 'task-form', className: 'task-form', onSubmit: handleCreateTask },
              e('input', {
                id: 'new-task-input',
                'data-testid': 'new-task-input',
                type: 'text',
                placeholder: 'Enter new task title...',
                value: title,
                onChange: function(ev) { setTitle(ev.target.value); },
                onInput: function(ev) { setTitle(ev.target.value); }
              }),
              e('button', { id: 'add-task-btn', 'data-testid': 'add-task-btn', type: 'submit', onClick: handleCreateTask }, 'Add Task')
            ),
            e('div', { id: 'item-list', 'data-testid': 'item-list' },
              loading ? e('p', { id: 'loading-indicator' }, 'Loading tasks...') :
              tasks.map(function(t) {
                return e('div', { key: t.id, className: 'task-card', 'data-testid': 'item-card' },
                  e('span', { className: 'task-title', 'data-testid': 'task-title' }, t.title),
                  e('span', { className: 'task-status' }, t.status || (t.completed ? 'COMPLETED' : 'PENDING'))
                );
              })
            )
          );
        }

        var root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(App);
      })();
    </script>
  </body>
</html>
